name: Pin Gate

# Thin caller for the org-shared Actions-pinning gate. The org ruleset
# "auto-merge gate (org)" requires its check on the default branch.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pin-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pin-check:
    permissions:
      contents: read
    uses: rarebit-one/.github/.github/workflows/pin-check.yml@main
